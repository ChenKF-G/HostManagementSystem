# Host Manager 一键部署编排文件
version: "3.8"

services:
  db:
    image: mysql:8.0
    container_name: host_manager_mysql
    environment:
      MYSQL_DATABASE: host_manager
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-root123456}
      TZ: Asia/Shanghai
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-proot123456"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: host_manager_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  web:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: host_manager_web
    command: >
      sh -c "python manage.py migrate &&
             python manage.py runserver 0.0.0.0:8000"
    environment:
      DB_HOST: db
      DB_USER: root
      DB_PASSWORD: ${DB_PASSWORD:-root123456}
      REDIS_URL: redis://redis:6379/0
      ENCRYPT_KEY: ${ENCRYPT_KEY}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY}
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    volumes:
      - ..:/app

  celery-worker:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: host_manager_celery_worker
    command: celery -A tasks worker -l info
    environment:
      DB_HOST: db
      DB_USER: root
      DB_PASSWORD: ${DB_PASSWORD:-root123456}
      REDIS_URL: redis://redis:6379/0
      ENCRYPT_KEY: ${ENCRYPT_KEY}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    volumes:
      - ..:/app

  celery-beat:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: host_manager_celery_beat
    command: celery -A tasks beat -l info
    environment:
      DB_HOST: db
      DB_USER: root
      DB_PASSWORD: ${DB_PASSWORD:-root123456}
      REDIS_URL: redis://redis:6379/0
      ENCRYPT_KEY: ${ENCRYPT_KEY}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    volumes:
      - ..:/app

volumes:
  mysql_data:
  redis_data:
